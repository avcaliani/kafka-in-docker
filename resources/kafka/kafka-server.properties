# Overrides only. Anything not listed here uses Kafka's built-in default.
# Defaults: /opt/kafka/config/server.properties or https://kafka.apache.org/documentation/#brokerconfigs

# Single node acting as broker and KRaft controller.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
controller.listener.names=CONTROLLER

# Two client listeners:
# - INTERNAL: for other containers ("kafka-dev" is the host name in docker compose).
# - EXTERNAL: for access from outside docker.
listeners=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=INTERNAL://kafka-dev:29092,EXTERNAL://localhost:9092
inter.broker.listener.name=INTERNAL
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

log.dirs=/tmp/kraft-combined-logs
num.partitions=3
num.recovery.threads.per.data.dir=1

# Single node: internal topics can't be replicated.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Dev: don't wait for more consumers before the first rebalance.
group.initial.rebalance.delay.ms=0

# Personal note: ZooKeeper x KRaft (https://developer.confluent.io/learn/kraft/)
# From Kafka 4.0 on, ZooKeeper is gone, KRaft replaces it.

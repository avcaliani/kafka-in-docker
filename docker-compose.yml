services:

  # This image is available in DockerHub.
  # https://hub.docker.com/r/avcaliani/kafka-in-docker
  # But this one 👇 is the local image.
  kafka-dev:
    image: kafka-dev
    container_name: kafka-dev
    build: .
    ports:
      - "127.0.0.1:9092:9092" # Kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # https://hub.docker.com/r/provectuslabs/kafka-ui
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "kafka-dev-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-dev:29092"
    depends_on:
      kafka-dev:
        condition: service_healthy
